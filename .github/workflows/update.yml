name: Update report
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Which data to generate"
        type: choice
        default: mock
        options: [mock, live, auto-discover]
  schedule:
    - cron: "0 6 * * 1"
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytrends feedparser || true
      - name: Generate data.json
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          case "$MODE" in
            live)          python export_web.py ;;
            auto-discover) python export_web.py --auto-discover ;;
            *)             python export_web.py --mock ;;
          esac
      - name: Commit refreshed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json watchlist.csv
          git commit -m "chore: refresh report data" || echo "no changes"
          git push
